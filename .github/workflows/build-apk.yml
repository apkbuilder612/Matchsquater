name: Build Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --console=plain > build-log.txt 2>&1 || echo "BUILD_FAILED=1" >> $GITHUB_ENV

      - name: Show error summary if failed
        if: env.BUILD_FAILED == '1'
        run: |
          echo "## ❌ Build Error (last 60 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 build-log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-squater-native-apk
          path: app/build/outputs/apk/debug/app-debug.apk
